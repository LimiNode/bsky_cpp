name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Configure
        run: cmake -S . -B build/ci -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DBSKY_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build/ci --config ${{ matrix.build_type }} --parallel
      - name: Test
        run: ctest --test-dir build/ci --build-config ${{ matrix.build_type }} --output-on-failure
      - name: Documentation links
        run: python tools/check_markdown_links.py
      - name: Documentation link checker tests
        run: python tools/test_check_markdown_links.py
      - name: Install
        run: cmake --install build/ci --config ${{ matrix.build_type }} --prefix "${{ github.workspace }}/build/install"
      - name: Consumer configure
        run: cmake -S tests/consumer -B build/consumer -DCMAKE_PREFIX_PATH="${{ github.workspace }}/build/install" -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Consumer build
        run: cmake --build build/consumer --config ${{ matrix.build_type }} --parallel
      - name: Consumer test
        run: ctest --test-dir build/consumer --build-config ${{ matrix.build_type }} --output-on-failure

  sanitizers:
    name: Ubuntu / sanitizers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build/sanitized -DCMAKE_BUILD_TYPE=Debug -DBSKY_BUILD_TESTS=ON -DBSKY_ENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build/sanitized --parallel
      - name: Test
        run: ctest --test-dir build/sanitized --output-on-failure

  runtime:
    name: Runtime / ${{ matrix.os }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Initialize pinned runtime dependency
        run: git submodule update --init external/event-hub-cpp
      - name: Configure
        run: cmake -S . -B build/runtime-ci -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DBSKY_BUILD_TESTS=ON -DBSKY_BUILD_RUNTIME=ON
      - name: Build
        run: cmake --build build/runtime-ci --config ${{ matrix.build_type }} --parallel
      - name: Test
        run: ctest --test-dir build/runtime-ci --build-config ${{ matrix.build_type }} --output-on-failure
      - name: Repeat runtime race and lifetime tests
        run: ctest --test-dir build/runtime-ci --build-config ${{ matrix.build_type }} -R "^bsky_cpp.runtime$" --repeat until-fail:20 --output-on-failure
      - name: Install
        run: cmake --install build/runtime-ci --config ${{ matrix.build_type }} --prefix "${{ github.workspace }}/build/runtime-install"
      - name: Runtime consumer configure
        run: cmake -S tests/consumer -B build/runtime-consumer -DCMAKE_PREFIX_PATH="${{ github.workspace }}/build/runtime-install" -DBSKY_CONSUMER_RUNTIME=ON -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Runtime consumer build
        run: cmake --build build/runtime-consumer --config ${{ matrix.build_type }} --parallel
      - name: Runtime consumer test
        run: ctest --test-dir build/runtime-consumer --build-config ${{ matrix.build_type }} --output-on-failure
      - name: Foundation isolation with runtime installed
        run: cmake -DPREFIX="${{ github.workspace }}/build/runtime-install" -DOUTPUT="${{ github.workspace }}/build/package-isolation" -DSOURCE_DIR="${{ github.workspace }}" -DBUILD_TYPE=${{ matrix.build_type }} -P tools/check_package_isolation.cmake

  documentation:
    name: Documentation / Doxygen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y doxygen
      - name: Report Doxygen version
        run: doxygen --version
      - name: Configure documentation
        run: cmake -S . -B build/docs -DBSKY_BUILD_TESTS=OFF -DBSKY_BUILD_DOCUMENTATION=ON
      - name: Build documentation (warnings are errors)
        run: timeout --foreground 5m cmake --build build/docs --target bsky_cpp_docs --parallel

  runtime-sanitizers:
    name: Runtime / Ubuntu / sanitizers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Initialize pinned runtime dependency
        run: git submodule update --init external/event-hub-cpp
      - name: Configure
        run: cmake -S . -B build/runtime-sanitized -DCMAKE_BUILD_TYPE=Debug -DBSKY_BUILD_TESTS=ON -DBSKY_BUILD_RUNTIME=ON -DBSKY_ENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build/runtime-sanitized --parallel
      - name: Test
        run: ctest --test-dir build/runtime-sanitized --output-on-failure
      - name: Repeat runtime race and lifetime tests under sanitizers
        run: ctest --test-dir build/runtime-sanitized -R "^bsky_cpp.runtime$" --repeat until-fail:20 --output-on-failure

  runtime-tsan:
    name: Runtime / Ubuntu / TSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Initialize pinned runtime dependency
        run: git submodule update --init external/event-hub-cpp
      - name: Configure
        run: >-
          cmake -S . -B build/runtime-tsan
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"
          -DBSKY_BUILD_TESTS=ON -DBSKY_BUILD_RUNTIME=ON
      - name: Build
        run: cmake --build build/runtime-tsan --parallel
      - name: Test runtime race fixture
        run: ctest --test-dir build/runtime-tsan -R "^bsky_cpp.runtime$" --output-on-failure

  runtime-documentation:
    name: Runtime / Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Initialize pinned runtime dependency
        run: git submodule update --init external/event-hub-cpp
      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y doxygen
      - name: Configure documentation
        run: cmake -S . -B build/runtime-docs -DBSKY_BUILD_TESTS=OFF -DBSKY_BUILD_RUNTIME=ON -DBSKY_BUILD_DOCUMENTATION=ON
      - name: Build documentation (warnings are errors)
        run: timeout --foreground 5m cmake --build build/runtime-docs --target bsky_cpp_docs --parallel
